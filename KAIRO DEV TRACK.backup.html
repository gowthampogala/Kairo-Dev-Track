<script>

[3,10,1,"Authentication",["Spring Security fundamentals","Password hashing","Registration and login flows","Authentication versus authorization","Sessions and JWT concepts"],"Secure registration and login with hashed passwords"],

[4,14,1,"Embeddings and semantic retrieval",["Embeddings and semantic similarity","Document chunking","Vector search and metadata filtering","PostgreSQL with pgvector or an equivalent vector database","Evaluate retrieval relevance"],"Search a collection of documents and return relevant passages"],

[5,16,2,"Build the capstone",["React user interface","Spring Boot API and relational database","LLM integration through the backend","Document ingestion and retrieval","Authentication and access control","Add tool calling only when it solves a real problem"],"A working end-to-end AI application"],
[5,18,2,"Production readiness",["Docker and Docker Compose","Automated build and test pipeline","Deployment, logging and error handling","Security review and environment configuration","Edge-case testing and UI improvements","Architecture documentation and README"],"A deployed capstone with a live link, source code, setup instructions and an architecture explanation"],
[6,20,1,"Job readiness",["Java, OOP, collections and exception revision","SQL, DBMS and networking revision","DSA practice and complexity analysis","Technical and HR mock interviews","Resume and GitHub cleanup","Practise explaining project decisions in English"],"A polished portfolio, a project presentation and a list of topics to revise before interviews"]]
.map(([p,s,n,t,i,d,x])=>({p,s,n,t,i,d,x}));

a.push({t:'Deliverable: '+b.d,c:'Build',m:1});if(b.x)a.push({t:'Self-test: '+b.x,c:'Test',s:1});const sd=6*b.n;
a.forEach((o,k)=>{const q=Math.floor(k*sd/a.length);T.push({id:bi+'.'+k,b:bi,d:q+Math.floor(q/6)+1,title:o.t,cat:o.c,m:o.m,s:o.s})})});
const PR=[["React API application","Build a React app consuming a public API with routing, forms and clean state handling.","React, JavaScript, React Router, fetch",["Scaffold app and routing","Fetch and render API data","Loading and error states","Forms and CRUD interactions","Responsive styling and accessibility","Deploy and write README"]],
["Java and Spring Boot REST API","Design a persistent, validated, tested REST API.","Java, Spring Boot, JPA, PostgreSQL/MySQL, JUnit",["Controller-service-repository structure","Entities and relationships","DTOs and validation","Global exception handling","Unit and integration tests","Deploy with README and endpoint docs"]],
["Full-stack application with authentication","React front end with Spring Security and JWT.","React, Spring Boot, Spring Security, JWT, SQL",["Registration and login","JWT validation and roles","Protected endpoints and pages","CRUD with persistence","Test key user flows","Deploy and document"]],
["AI-enabled full-stack capstone","End-to-end document Q&A app with retrieval and grounded answers.","React, Spring Boot, LLM API, pgvector, Docker",["Document ingestion and chunking","Embeddings and vector search","RAG answers with sources","Authentication and access control","Docker Compose and CI pipeline","Deploy, architecture doc and README"]]];

const KEY='kairo-dev-track-v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=n=>`<svg viewBox="0 0 24 24">${{lay:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',chk:'<path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/>',map:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/>',fol:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8L10 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',rev:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',ch:'<path d="m9 6 6 6-6 6"/>',pl:'<path d="M12 5v14M5 12h14"/>',tr:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',pe:'<path d="M17 3l4 4L8 20H4v-4z"/>',ar:'<path d="M5 12h14m-6-6 6 6-6 6"/>'}[n]}</svg>`;
const ld=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let S,ui={page:'overview',open:{},q:'',fs:'all',fc:'all',cf:null,edit:null,nav:0,io:'',msg:''},bad=0;
const def=()=>({start:ld(),target:6,theme:'dark',done:{},custom:[],sel:null,blk:{},proj:{},rev:{},st:{}});
function load(){let r=null;try{r=JSON.parse(localStorage.getItem(KEY))}catch(e){bad=1}S=Object.assign(def(),r||{});if(!S.sel){const c=cur();S.sel={b:c.b,d:c.d}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){bad=1}}
function cur(){const n=Math.floor((new Date(S.start)-0>0?(new Date(ld())-new Date(S.start))/864e5:0)),w=Math.min(20,Math.max(1,Math.floor(n/7)+1)),b=C.findIndex(x=>w>=x.s&&w<x.s+x.n);return{w,b,d:Math.min(7*C[b].n,Math.max(1,n-(C[b].s-1)*7+1))}}
const isD=t=>t.custom?!!t.done:!!S.done[t.id],pc=a=>a.length?Math.round(a.filter(isD).length/a.length*100):0,tb=b=>T.filter(t=>t.b==b),tp=p=>T.filter(t=>C[t.b].p==p);

function side(){const c=cur(),all=pc(T),N=[['overview','lay','Overview'],['daily','chk','Daily Checklist'],['roadmap','map','20-Week Roadmap'],['projects','fol','Projects'],['reviews','rev','Weekly Reviews'],['settings','set','Settings']];

const dayT=(b,d)=>[...T.filter(t=>t.b==b&&t.d==d),...S.custom.filter(t=>t.b==b&&t.d==d).map(t=>({...t,custom:1}))];
function vOver(){const c=cur(),b=C[c.b],ph=C[c.b].p,tw=tb(c.b),td=dayT(c.b,c.d),all=T.filter(isD).length,ms=T.find(t=>t.m&&!isD(t)),pi=PR.findIndex((p,i)=>(S.proj[i]?.st||'Not started')!='Done'),pj=S.proj[pi]||{},days=[...Array(7)].map((_,i)=>ld(new Date(Date.now()-(6-i)*864e5))),ct=days.map(d=>Object.values(S.done).filter(v=>v==d).length+S.custom.filter(t=>t.done==d).length),mx=Math.max(1,...ct);
return`<div class="hd"><div><div class="m">PHASE ${ph+1} · ${wl(b).toUpperCase()}</div><h1>${esc(b.t)}</h1><p class="sub">${PH[ph]}</p></div><button class="bt pr" data-a="cont">Continue Learning ${ic('ar')}</button></div>
<div class="g"><div class="card"><div class="lb">Overall roadmap</div><div class="big">${pc(T)}%</div>${bar(pc(T))}<div class="m" style="margin-top:8px">${all} done · ${T.length-all} remaining</div></div>

<div class="card"><div class="lb">Weekly self-test</div><div style="color:var(--wh);margin-top:6px">${b.x?(S.st[c.b]||'Not taken'):'No self-test this block'}</div><div class="m">${tw.filter(isD).length}/${tw.length} week tasks</div></div>

<div class="tabs">${[...Array(7*B.n)].map((_,i)=>`<button class="bt tb ${i+1==d?'on':''}" data-a="seld" data-v="${i+1}">${(i+1)%7==0?'R':i+1}</button>`).join('')}</div>${filt()}
<div class="card"><div class="hd"><h2>Tasks</h2><span class="m">${all.filter(isD).length}/${all.length} complete</span></div><div id="lst">${dList()}</div></div>
<div class="card" style="margin-top:12px"><h2>${ui.edit?'Edit custom task':'Add custom task'}</h2><div class="cols" style="margin-top:12px"><div class="f"><span class="lb">Title</span><input type="text" id="nt" value="${esc(ed.title)}"></div><div class="f"><span class="lb">Description (optional)</span><input type="text" id="nd" value="${esc(ed.desc)}"></div><div class="f"><span class="lb">Category</span><select id="nc">${['Learn','Practise','Build','Test','Review'].map(o=>`<option ${ed.cat==o?'selected':''}>${o}</option>`).join('')}</select></div><div class="f"><span class="lb">Minutes (optional)</span><input type="number" id="nm" min="0" value="${ed.min||''}"></div></div><button class="bt" data-a="save">${ic('pl')}${ui.edit?'Save task':'Add task'}</button> ${ui.edit?'<button class="bt" data-a="nocf">Cancel</button>':''}</div>
<div class="card" style="margin-top:12px"><div class="hd"><h2>Study blocks</h2><span class="m">${(e.d||[]).filter(Boolean).length}/5 · optional</span></div>${B.s>=13&&B.s<=19?'<p class="sub">Main learning can shift toward AI during these weeks.</p>':''}${BL.map((x,i)=>`<div class="row"><input type="checkbox" id="b${i}" data-a="blk" data-v="${i}" ${e.d?.[i]?'checked':''}><label for="b${i}">${bn(b,i)}</label><span class="m">${x[1]}m</span></div>`).join('')}
<div class="cols" style="margin-top:12px"><div class="f"><span class="lb">Hours studied (target ${S.target})</span><input type="number" step=".25" min="0" data-b="blk.${k}.h" value="${esc(e.h)}"></div><div class="f"><span class="lb">Notes</span><textarea data-b="blk.${k}.n">${esc(e.n)}</textarea></div></div></div>`}
function roadList(){const open=ui.q||ui.fs!='all'||ui.fc!='all',c=cur();return PH.map((n,p)=>{const bs=C.map((b,i)=>[b,i]).filter(x=>x[0].p==p),pp=pc(tp(p)),st=pp==100?'Completed':c.b!=null&&C[c.b].p==p?'Active':'Upcoming',o=open||ui.open['p'+p];
return`<div class="card" style="margin-bottom:12px"><button class="acc ${o?'o':''}" data-a="open" data-v="p${p}">${ic('ch')}<span style="flex:1"><b style="font-weight:500">Phase ${p+1} · ${n}</b><div class="m">${wl(bs[0][0]).replace('Week ','W').replace('Weeks ','W')}${bs.length>1||bs[0][0].n>1?'–'+(bs.at(-1)[0].s+bs.at(-1)[0].n-1):''} · ${bs.map(x=>x[0].t).join(' → ')}</div></span><span class="bg ${st=='Completed'?'gr':''}">${st}</span><span class="m">${pp}%</span></button>${bar(pp)}${o?bs.map(([b,i])=>{const l=tb(i),f=l.filter(match),w=ui.open['b'+i]||open;if(open&&!f.length)return'';return`<div style="margin-top:8px"><button class="acc ${w?'o':''}" data-a="open" data-v="b${i}">${ic('ch')}<span style="flex:1">${wl(b)}: ${esc(b.t)}</span><span class="m">${pc(l)}%</span></button>${w?(open?f:l).map(row).join(''):''}</div>`}).join(''):''}</div>`}).join('')}
const vRoad=()=>`<h1>20-Week Roadmap</h1><p class="sub">Seven phases. Every phase is open to inspect; nothing is locked.</p>${filt()}<div id="lst">${roadList()}</div>`;
function vProj(){return`<h1>Projects</h1><p class="sub">Links stay empty until you add them.</p><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">${PR.map((p,i)=>{const s=S.proj[i]||{},dn=s.done||{},n=Object.values(dn).filter(Boolean).length;return`<div class="card"><div class="hd"><h2>${p[0]}</h2><span class="bg">${s.st||'Not started'}</span></div><p class="sub">${p[1]}</p><p class="m">${p[2]}</p>${bar(Math.round(n/p[3].length*100))}${p[3].map((t,k)=>`<div class="row"><input type="checkbox" id="p${i}${k}" data-a="pt" data-i="${i}" data-k="${k}" ${dn[k]?'checked':''}><label for="p${i}${k}">${t}</label></div>`).join('')}
<div class="f"><span class="lb">Status</span><select data-b="proj.${i}.st">${['Not started','In progress','Done'].map(o=>`<option ${(s.st||'Not started')==o?'selected':''}>${o}</option>`).join('')}</select></div><div class="f"><span class="lb">GitHub repository URL</span><input type="url" data-b="proj.${i}.repo" value="${esc(s.repo)}" placeholder="https://github.com/…"></div><div class="f"><span class="lb">Live deployment URL</span><input type="url" data-b="proj.${i}.live" value="${esc(s.live)}" placeholder="https://…"></div><div class="f"><span class="lb">Notes and lessons learned</span><textarea data-b="proj.${i}.notes">${esc(s.notes)}</textarea></div></div>`}).join('')}</div>`}
function vRev(){return`<h1>Weekly Reviews</h1><p class="sub">Weeks 16–17 and 18–19 are reviewed as single blocks.</p>`+C.map((b,i)=>{const l=tb(i),r=S.rev[i]||{},o=ui.open['r'+i],dv=l.find(t=>t.m),sf=l.find(t=>t.s);return`<div class="card" style="margin-top:12px"><button class="acc ${o?'o':''}" data-a="open" data-v="r${i}">${ic('ch')}<span style="flex:1">${wl(b)}: ${esc(b.t)}</span><span class="bg ${r.done?'gr':''}">${r.done?'Reviewed':'Open'}</span><span class="m">${l.filter(isD).length}/${l.length}</span></button>${o?`<p class="m">Completed ${l.filter(isD).length} · Remaining ${l.filter(t=>!isD(t)).length} · Deliverable ${isD(dv)?'done':'not done'}${sf?' · Self-test task '+(isD(sf)?'done':'not done'):''}</p><div class="f"><span class="lb">Self-test result</span><select data-b="st.${i}">${['Not taken','Passed','Needs revision'].map(x=>`<option ${(S.st[i]||'Not taken')==x?'selected':''}>${x}</option>`).join('')}</select></div>`+[['learned','What I learned'],['struggled','What I struggled with'],['revise','What I need to revise'],['next','Next week’s priority']].map(f=>`<div class="f"><span class="lb">${f[1]}</span><textarea data-b="rev.${i}.${f[0]}">${esc(r[f[0]])}</textarea></div>`).join('')+`<div class="row"><input type="checkbox" id="rv${i}" data-a="rv" data-i="${i}" ${r.done?'checked':''}><label for="rv${i}">Mark weekly review complete</label></div>`:''}</div>`}).join('')}
function vSet(){const c=cur();return`<h1>Settings</h1><div class="st" style="margin-top:16px"><div class="card"><div class="cols"><div class="f"><span class="lb">Start date</span><input type="date" data-b="start" data-r=1 value="${S.start}"></div><div class="f"><span class="lb">Daily study target (hours)</span><input type="number" step=".5" min="1" data-b="target" value="${S.target}"></div><div class="f"><span class="lb">Theme</span><select data-b="theme">${['dark','light'].map(o=>`<option ${S.theme==o?'selected':''}>${o}</option>`).join('')}</select></div></div><p class="sub">Roadmap: 20 weeks. Calculated current week: ${c.w} (${wl(C[c.b])}, day ${c.d}).</p></div>
<div class="card"><h2>Export / import</h2><p class="sub">${bad?'Browser storage is unavailable here; progress will not survive a reload. Export regularly. ':''}Progress lives in this browser’s local storage and does not sync between devices. Export to move it.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="bt" data-a="exp">Export JSON</button><button class="bt" data-a="imp">Import from text box</button><label class="bt" for="fi">Import file</label><input type="file" id="fi" accept=".json,application/json" hidden></div><textarea id="io" aria-label="JSON" style="min-height:110px" class="mono">${esc(ui.io)}</textarea><p class="sub">${esc(ui.msg)}</p></div>
<div class="card"><h2>Reset progress</h2><p class="sub">Erases all tasks, notes, projects and settings in this browser.</p>${ui.cf=='reset'?'<button class="bt dg" data-a="resetok">Yes, erase everything</button> <button class="bt" data-a="nocf">Cancel</button>':'<button class="bt dg" data-a="cf" data-v="reset">Reset progress…</button>'}</div></div>`}
function render(){side();$('#main').innerHTML={overview:vOver,daily:vDaily,roadmap:vRoad,projects:vProj,reviews:vRev,settings:vSet}[ui.page]();window.scrollTo(0,ui.keep||0);ui.keep=0}
const list=()=>{$('#lst').innerHTML=ui.page=='daily'?dList():roadList()};
function imp(txt){try{const o=JSON.parse(txt);if(!o||typeof o!='object'||!o.done)throw 0;S=Object.assign(def(),o);save();ui.msg='Import successful.'}catch(e){ui.msg='Import failed: not a valid KAIRO progress file.'}render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v,id=el.dataset.id;ui.keep=window.scrollY;let R=1;
if(a=='nav'){ui.page=v;ui.nav=0;ui.keep=0;ui.q='';ui.fs=ui.fc='all'}else if(a=='menu'){ui.nav=!ui.nav}
else if(a=='tg'){if(el.checked)S.done[id]=ld();else delete S.done[id]}else if(a=='tgc'){const t=S.custom.find(x=>x.id==id);t.done=el.checked?ld():''}
else if(a=='cont'){const c=cur();S.sel={b:c.b,d:c.d};ui.page='daily';ui.keep=0}else if(a=='seld')S.sel.d=+v;else if(a=='open'){ui.open[v]=!ui.open[v]}
else if(a=='blk'){const k=S.sel.b+':'+S.sel.d;const e=S.blk[k]=S.blk[k]||{d:[],h:'',n:''};e.d[+v]=el.checked}
else if(a=='pt'){const p=S.proj[el.dataset.i]=S.proj[el.dataset.i]||{};(p.done=p.done||{})[el.dataset.k]=el.checked}else if(a=='rv'){set('rev.'+el.dataset.i+'.done',el.checked)}
else if(a=='save'){const t=$('#nt').value.trim();if(!t)return $('#nt').focus();const o={title:t,desc:$('#nd').value.trim(),cat:$('#nc').value,min:+$('#nm').value||0};if(ui.edit)Object.assign(S.custom.find(x=>x.id==ui.edit),o);else S.custom.push({id:'c'+Date.now(),b:S.sel.b,d:S.sel.d,done:'',...o});ui.edit=null}
else if(a=='edit'){ui.edit=id;ui.keep=0}else if(a=='nocf'){ui.cf=null;ui.edit=null}else if(a=='del'||a=='cf')ui.cf=id||v;else if(a=='delok'){S.custom=S.custom.filter(x=>x.id!=id);ui.cf=null}
else if(a=='resetok'){S=def();const c=cur();S.sel={b:c.b,d:c.d};ui.cf=null;ui.msg='Progress reset.'}
else if(a=='exp'){ui.io=JSON.stringify(S,null,1);ui.msg='Copy this JSON and keep it safe.';try{const u=URL.createObjectURL(new Blob([ui.io],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='kairo-progress-'+ld()+'.json';l.click()}catch(x){}}
else if(a=='imp'){imp($('#io').value);return}else R=0;
if(R){save();render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.b){set(t.dataset.b,t.type=='checkbox'?t.checked:t.value);save();side();if(t.dataset.r)render()}else if(t.dataset.f){ui[t.dataset.f]=t.value;list()}else if(t.dataset.a=='selb'){S.sel={b:+t.value,d:1};save();ui.keep=0;render()}});
document.addEventListener('change',e=>{if(e.target.id=='fi'){const f=e.target.files[0];if(f)f.text().then(imp)}});
load();render();
</script></body></html>
